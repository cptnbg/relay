name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -s bash -S warning \
            plugins/relay/scripts/*.sh \
            plugins/relay/scripts/lib/*.sh \
            plugins/relay/hooks/*.sh \
            test/run.sh test/lib/*.sh test/lint/*.sh test/bin/claude \
            test/publish-check.sh
          # The case and hook files are sourced fragments: they run inside the
          # harness subshell, so variables like ROOT and RELAY_MOCK_DIR arrive
          # from the runner (SC2154) and read-placeholders from destructuring
          # `IFS='|' read -r A B C` are deliberately unused (SC2034).
          shellcheck -s bash -S warning -e SC2034,SC2154 \
            test/cases/*.sh test/hook/*.sh

      - name: no bash 4+ constructs
        run: bash test/lint/no-bash4.sh

      - name: no forbidden dependencies
        run: bash test/lint/no-deps.sh

      - name: plugin layer consistency
        run: bash test/lint/plugin-layer.sh

      - name: publish gates (pure-shell subset)
        # publish-check.sh guards its `claude plugin validate` gate behind
        # `command -v claude`, so everything else (doc gates, exit-code
        # citations) still gates here without the CLI.
        run: bash test/publish-check.sh

      - name: manifests are valid json
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/relay/.claude-plugin/plugin.json \
                   plugins/relay/config/defaults.json; do
            jq -e . "$f" > /dev/null || { echo "invalid: $f"; exit 1; }
          done

      - name: plugin and marketplace versions agree
        run: |
          a=$(jq -r .version plugins/relay/.claude-plugin/plugin.json)
          b=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          echo "plugin.json=$a marketplace=$b"
          [ "$a" = "$b" ] || { echo "version mismatch"; exit 1; }

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install jq (macos)
        if: runner.os == 'macOS'
        run: brew list jq >/dev/null 2>&1 || brew install jq

      - name: assert coreutils timeout is absent (macos)
        if: runner.os == 'macOS'
        run: |
          if command -v timeout >/dev/null 2>&1 || command -v gtimeout >/dev/null 2>&1; then
            echo "coreutils is installed on this runner; the suite would not prove independence"
            exit 1
          fi

      - name: record bash version
        run: bash --version | head -1

      - name: assert system bash is 3.x (macos)
        # The portability contract is bash 3.2.57. If Apple ever ships a
        # newer /bin/bash, this job would silently stop proving anything —
        # assert it instead of just printing it.
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ] || {
            echo "expected bash 3.x at /bin/bash, got $BASH_VERSION"; exit 1; }'

      - name: unit suites
        run: |
          bash test/lib/test-relay-lib.sh
          bash test/lib/test-relay-git.sh

      - name: hook and supervisor suites
        run: bash test/run.sh

      - name: rerun everything under system bash 3.2 (macos)
        if: runner.os == 'macOS'
        run: |
          /bin/bash test/lib/test-relay-lib.sh
          /bin/bash test/lib/test-relay-git.sh
          /bin/bash test/run.sh

      - name: keep sandboxes on failure
        if: failure()
        run: echo "re-run locally with RELAY_TEST_KEEP=1 to inspect sandboxes"
